ls:
    .dir: regex:([.a-z0-9]*)([-.][a-z0-9]+)*
    .css: regex:([.a-z0-9]*)([-.][a-z0-9]+)*
    .ts: regex:([.a-z0-9]*)([-.][a-z0-9]+)*
    .tsx: regex:([.a-z0-9]*)([-.][a-z0-9]+)*

ignore:
    - .git
    - .github
    - .idea/**
    - .vscode
    - node_modules
    - .next
    - build
    - public
    - src/generated
    - src/libs/modules/prisma/migrations
    - src/app/api/auth/[...nextauth]

name: Continuous Integration

on:
    pull_request:
        branches:
            - development
            - production
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    dependencies:
        name: Install Dependencies
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4

            - name: Install NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Cache Dependencies
              id: cache
              uses: actions/cache@v3
              with:
                  path: '**/node_modules'
                  key: ci-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ci-

            - name: Install Dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm install

    lint:
        name: Code Linting
        needs: dependencies
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Install NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Restore Dependencies
              uses: actions/cache@v3
              with:
                  path: '**/node_modules'
                  key: ci-${{ hashFiles('**/package-lock.json') }}

            - name: Generate Prisma Client
              run: npx prisma generate
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devdash

            - name: Code Linting
              run: npm run lint
